# Cross-compilation: ARM 32-bit Linux 
#
# Usage (trace_proxy only — libpcap absent in sysroot is fine, stubs are used):
#   meson setup builddir --cross-file cross/arm-openipc-linux-gnueabi.ini \
#         -Dbuild_proxy=false
#
# Usage (full project — wayland stack must be in sysroot):
#   meson setup builddir --cross-file cross/arm-openipc-linux-gnueabi.ini
#
# Usage (with ipc_backend matching target Qt build):
#   meson setup builddir --cross-file cross/arm-openipc-linux-gnueabi.ini \
#         -Dbuild_proxy=false -Dipc_backend=posix

[constants]
toolchain = '/output/host/opt/ext-toolchain/bin'
target = 'arm-openipc-linux-gnueabi'

[binaries]
c         = toolchain / target + '-gcc'
cpp       = toolchain / target + '-g++'
ar        = toolchain / target + '-ar'
strip     = toolchain / target + '-strip'
pkg-config = 'pkg-config'
wayland-scanner = '/output/host/bin/wayland-scanner'

[properties]
sys_root               = '/output/host/arm-buildroot-linux-gnueabi/sysroot'
pkg_config_libdir      = ['/output/host/arm-buildroot-linux-gnueabi/sysroot/usr/lib/pkgconfig',
                          '/output/host/arm-buildroot-linux-gnueabi/sysroot/usr/share/pkgconfig',
                          '/output/host/opt/ext-toolchain/arm-openipc-linux-gnueabi/sysroot/usr/lib/pkgconfig']
pkg_config_sysroot_dir = sys_root

[built-in options]
c_args   = ['-Wno-pedantic']
cpp_args = ['-Wno-pedantic']

[host_machine]
system     = 'linux'
cpu_family = 'arm'
endian     = 'little'
cpu        = 'arm'
